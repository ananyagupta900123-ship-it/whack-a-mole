<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whack-a-Mole</title>
<style>
:root{--bg:#EEF3F1;--surface:#FBFDFC;--ink:#1B2A41;--line:#B4C4BF;--blue:#1F4FD8;--red:#C42B2B;--hl:#F4D35E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1E;--surface:#15242A;--ink:#E6EEEA;--line:#2D434B;--blue:#8DAEFF;--red:#FF7B72;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,sans-serif}
main{width:min(92vw,400px);text-align:center}
h1{font-size:30px;margin:0 0 4px}
p{margin:6px 0}
button{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:8px 16px;cursor:pointer}
button:hover{background:var(--hl);color:#1B2A41}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
</style>
<style>
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.hole{aspect-ratio:1;border-radius:50%;font-size:clamp(34px,12vw,56px);padding:0;background:var(--line);border-color:var(--ink)}
.hole.up{background:var(--hl)}
.hole:disabled{cursor:default;opacity:1}
</style></head>
<body><main>
<h1>Whack-a-Mole</h1>
<p>Tap the mole when it pops up. You have 30 seconds.</p>
<p id="info">Score 0 | Time 30 | Best 0</p>
<div class="field" id="f"></div>
<p id="msg" role="status">Press Start.</p>
<div class="row"><button id="start">Start</button></div>
</main>
<script>
// Whack-a-Mole: 9 holes. One mole appears at a time. The mole stays up for a shorter time as your score rises.
const field = document.getElementById('f'), info = document.getElementById('info'), msg = document.getElementById('msg');
let score = 0, time = 30, active = -1, moleTimer, clock, playing = false, best = 0;
try { best = +localStorage.getItem('moleBest') || 0; } catch (e) {}

const holes = Array.from({length: 9}, (_, i) => {
  const h = document.createElement('button'); h.className = 'hole'; h.disabled = true;
  h.setAttribute('aria-label', 'Hole ' + (i + 1)); h.onclick = () => hit(i); field.appendChild(h); return h;
});
function update() { info.textContent = 'Score ' + score + ' | Time ' + time + ' | Best ' + best; }
function hide() { if (active >= 0) { holes[active].textContent = ''; holes[active].classList.remove('up'); holes[active].setAttribute('aria-label', 'Hole ' + (active + 1)); } active = -1; }

function spawn() {
  if (!playing) return;
  const last = active; hide();
  let i; do { i = Math.floor(Math.random() * 9); } while (i === last);   // never the same hole twice in a row
  active = i; holes[i].textContent = '\u{1F439}'; holes[i].classList.add('up'); holes[i].setAttribute('aria-label', 'Hole ' + (i + 1) + ', mole');
  const stay = Math.max(450, 900 - score * 15);                           // gets faster as you score
  moleTimer = setTimeout(() => { hide(); moleTimer = setTimeout(spawn, 200); }, stay);
}
function hit(i) {
  if (!playing || i !== active) return;
  score++; hide(); clearTimeout(moleTimer); moleTimer = setTimeout(spawn, 150); update();
}
function start() {
  score = 0; time = 30; playing = true; msg.textContent = 'Go!'; update();
  holes.forEach(h => h.disabled = false);
  clearInterval(clock); clearTimeout(moleTimer);
  clock = setInterval(() => { time--; update(); if (time <= 0) end(); }, 1000);
  spawn();
}
function end() {
  playing = false; clearInterval(clock); clearTimeout(moleTimer); hide(); holes.forEach(h => h.disabled = true);
  if (score > best) { best = score; try { localStorage.setItem('moleBest', best); } catch (e) {} }
  msg.textContent = "Time's up! You whacked " + score + '.'; update();
}
document.getElementById('start').onclick = start;
</script></body></html>
